<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Screenshot Tool{% endblock %}</title>
<style>
  :root { --red:#d61e2c; --ink:#1a2130; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; --cream:#fff8e0; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:16px 24px; }
  header h1 { margin:0; font-size:18px; }
  header .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .wrap { max-width:960px; margin:24px auto; padding:0 20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:22px; margin-bottom:20px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { padding:10px 16px; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; font-size:14px; }
  .tab.active { background:var(--red); color:#fff; border-color:var(--red); }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input[type=text], textarea, input[type=file] { width:100%; padding:10px 12px; border:1px solid var(--line);
         border-radius:8px; font-size:14px; font-family:inherit; }
  textarea { min-height:64px; resize:vertical; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .btn { display:inline-block; background:var(--red); color:#fff; border:none; border-radius:8px;
         padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .muted { color:var(--muted); font-size:13px; }
  .error { background:#fdecec; color:#b3261e; border:1px solid #f5c2c0; padding:12px 14px; border-radius:8px; margin-bottom:16px; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; position:sticky; top:0; background:#fff; }
  .scroll { max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
  .shot { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
  .shot img { width:100%; display:block; }
  .shot .cap { padding:8px 10px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); }
  .cityhdr { margin:22px 0 10px; font-size:15px; font-weight:700; }
  .pill { display:inline-block; background:#eef1f5; color:var(--ink); border-radius:999px; padding:3px 10px; font-size:12px; margin:2px 4px 2px 0; }
  .steps { color:var(--muted); font-size:13px; }
  .hide { display:none; }
</style>
</head>
<body>
<header>
  <h1>InstaService Screenshot Tool</h1>
  <div class="sub">Excel &rarr; Service Information screenshots by city &rarr; ZIP. No emulator required.</div>
</header>
<div class="wrap">
  {% block body %}{% endblock %}
</div>
</body>
</html>
