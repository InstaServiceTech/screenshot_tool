name: Build and Deploy Docker Image
on:
  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      GCE_INSTANCE_IP: ${{ secrets.GCE_INSTANCE_IP }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
    steps:
      - name: Extract branch name
        id: extract_branch
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV

      - name: Build and Deploy Screenshot Tool Image on Dev Server
        uses: appleboy/ssh-action@v1.0.0
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          AUTH_USERS: ${{ secrets.AUTH_USERS }}
        with:
          host: ${{ secrets.GCE_INSTANCE_IP }}
          username: insta-tech
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port: 22
          envs: SECRET_KEY,AUTH_USERS
          script: |
            set -e #Exit if command fails

            cd screenshot_tool
            git fetch origin
            git checkout ${{ env.BRANCH_NAME }}
            git pull origin ${{ env.BRANCH_NAME }}

            if [ -z "$AUTH_USERS" ]; then
              echo "GitHub secret AUTH_USERS is required (do not use the local user:user default on the host)."
              exit 1
            fi

            # Inject .env from GitHub secrets. Do not echo values (passwords).
            python3 - <<'PY'
            import os
            secret = os.environ.get("SECRET_KEY") or ""
            users = os.environ.get("AUTH_USERS") or ""
            with open(".env", "w", encoding="utf-8") as f:
                f.write("SECRET_KEY=" + secret + "\n")
                f.write("AUTH_USERS=" + users + "\n")
            os.chmod(".env", 0o600)
            PY

            set -x
            sudo DOCKER_BUILDKIT=1 docker build -t screenshot-tool .
            if sudo docker ps --all --format "{{.Names}}" | grep -q "^screenshot-tool-container\$"; then
                sudo docker stop screenshot-tool-container || true
                sudo docker rm -f screenshot-tool-container || true
            fi

            echo "Starting a new container..."
            sudo docker run -d --name screenshot-tool-container --restart=always \
              -p 5006:5000 \
              -v screenshot-runs:/opt/screenshot-tool/app/runs \
              --env-file .env \
              screenshot-tool
